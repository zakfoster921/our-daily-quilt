<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>NOOK Workshops 2027</title>
  <style>
    :root {
      color: #3f3a35;
      background: #f9b76a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55;
    }
    body {
      margin: 0;
      padding: 32px 18px 48px;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.72);
      padding: 28px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-align: center;
    }
    .subtitle {
      color: #5c5148;
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
    }
    a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.2em;
    }
    form {
      margin-top: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.1rem;
    }
    @media (max-width: 480px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
    label {
      display: block;
      font-size: 0.95rem;
      color: #5c5148;
      margin-bottom: 0.35rem;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 1rem;
      color: #3f3a35;
      background: #fffdfb;
      border: 1px solid #d9d1c6;
      border-radius: 6px;
      padding: 0.65rem 0.75rem;
    }
    input:focus {
      outline: 2px solid #ea9b9a;
      outline-offset: 1px;
    }
    button {
      align-self: flex-start;
      font-family: inherit;
      font-size: 1rem;
      color: #fffdfb;
      background: #b5615f;
      border: none;
      border-radius: 999px;
      padding: 0.7rem 1.6rem;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    button:not(:disabled):hover {
      background: #9f4f4d;
    }
    #status-message {
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.98rem;
      display: none;
    }
    #status-message.show {
      display: block;
    }
    #status-message.success {
      background: #fdead0;
      color: #8a5a1e;
    }
    #status-message.duplicate {
      background: #fbf3e3;
      color: #6b5320;
    }
    #status-message.error {
      background: #fbe7e6;
      color: #7a2b28;
    }
    #status-message.closed {
      background: #efeae3;
      color: #5c5148;
    }
    .leaderboard-section {
      margin-top: 2rem;
      padding: 1.5rem;
      background: #fffdfb;
      border-radius: 10px;
    }
    .leaderboard-section h2 {
      font-size: 1.15rem;
      margin: 0 0 0.9rem;
      text-align: center;
    }
    #banner {
      padding: 0.75rem 0.9rem;
      color: #5c5148;
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
    }
    #banner.open {
      color: #2f5233;
    }
    ul#nominee-list {
      list-style: none;
      margin: 1rem 0 0;
      padding: 0;
    }
    .nominee-row {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid #e3dbcf;
    }
    .nominee-rank {
      width: 1.4rem;
      flex-shrink: 0;
      color: #a89a89;
      font-size: 0.9rem;
      text-align: right;
    }
    .nominee-info {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }
    .nominee-name {
      font-size: 1rem;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nominee-link {
      font-size: 0.82rem;
      color: #8a7c6d;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nominee-votes {
      font-size: 0.92rem;
      color: #5c5148;
      min-width: 1.4rem;
      text-align: right;
    }
    .heart-button {
      flex-shrink: 0;
      font-size: 1.2rem;
      line-height: 1;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.2rem;
      color: #b5615f;
    }
    .heart-button[disabled] {
      cursor: not-allowed;
      opacity: 0.3;
      color: #8a7c6d;
    }
    .heart-button:not(.voted):not([disabled])::before {
      content: "♡";
    }
    .heart-button.voted::before {
      content: "♥";
    }
    .heart-button[disabled]::before {
      content: "♡";
    }
    .nominee-actions {
      flex-shrink: 0;
      display: flex;
      gap: 0.6rem;
    }
    .nominee-action-btn {
      font-family: inherit;
      font-size: 0.78rem;
      color: #8a7c6d;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }
    .nominee-action-btn:hover {
      color: #5c5148;
    }
    .nominee-edit-row {
      padding: 0.7rem 0;
      border-bottom: 1px solid #e3dbcf;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .nominee-edit-row input {
      font-size: 0.92rem;
      padding: 0.5rem 0.6rem;
    }
    .nominee-edit-actions {
      display: flex;
      gap: 0.75rem;
    }
    .nominee-edit-actions button {
      padding: 0.4rem 1rem;
      font-size: 0.88rem;
    }
    .nominee-edit-actions .cancel-btn {
      background: none;
      color: #8a7c6d;
      border: 1px solid #d9d1c6;
    }
    #empty-state {
      margin-top: 1rem;
      color: #5c5148;
      display: none;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(63, 58, 53, 0.5);
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 10;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-box {
      background: #fffdfb;
      border-radius: 10px;
      padding: 1.75rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }
    .modal-box p {
      margin: 0 0 1.25rem;
      font-size: 1rem;
      color: #3f3a35;
    }
    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .modal-actions button {
      align-self: stretch;
      text-align: center;
    }
    .modal-actions .modal-no-btn {
      background: none;
      color: #5c5148;
      border: 1px solid #d9d1c6;
    }
    #admin-passcode-input {
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.6rem 0.7rem;
      border: 1px solid #d9d1c6;
      border-radius: 6px;
      margin-bottom: 1.25rem;
    }
    #admin-corner {
      position: fixed;
      top: 0;
      right: 0;
      width: 120px;
      height: 120px;
      z-index: 1000;
      background: transparent;
      opacity: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    .admin-panel {
      margin-top: 1.5rem;
      padding: 1.25rem;
      border: 1px solid #b5615f;
      border-radius: 10px;
      background: #fdf3ee;
    }
    .admin-panel h2 {
      margin: 0 0 1rem;
      font-size: 1rem;
      text-align: center;
      color: #8a4b12;
    }
    .admin-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
    }
    .admin-toggle-btn {
      font-size: 0.85rem;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      color: #fffdfb;
    }
    .admin-toggle-btn.state-open {
      background: #4c8a55;
    }
    .admin-toggle-btn.state-closed {
      background: #8a7c6d;
    }
    .admin-lock-row {
      margin-top: 0.75rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="confirm-modal-overlay" class="modal-overlay">
    <div class="modal-box">
      <p id="confirm-modal-message"></p>
      <div class="modal-actions">
        <button id="confirm-modal-yes" type="button">Yes, it's the same instructor</button>
        <button id="confirm-modal-no" type="button" class="modal-no-btn">No, please add this new instructor</button>
      </div>
    </div>
  </div>

  <div id="admin-passcode-overlay" class="modal-overlay">
    <div class="modal-box">
      <p>Enter admin passcode</p>
      <input id="admin-passcode-input" type="password" autocomplete="off" />
      <div class="modal-actions">
        <button id="admin-passcode-submit" type="button">Unlock</button>
        <button id="admin-passcode-cancel" type="button" class="modal-no-btn">Cancel</button>
      </div>
    </div>
  </div>

  <main>
    <h1>NOOK Workshops 2027</h1>
    <p class="subtitle">
      Who do you want to see teach on the NOOK?
    </p>

    <form id="nomination-form">
      <div class="form-row">
        <div>
          <label for="instructor-name">Instructor's name</label>
          <input id="instructor-name" name="name" type="text" maxlength="80" required autocomplete="off" />
        </div>
        <div>
          <label for="instructor-link">Instagram or website (optional)</label>
          <input id="instructor-link" name="link" type="text" maxlength="200" autocomplete="off" />
        </div>
      </div>
      <div>
        <label for="instructor-note">Why them? (optional)</label>
        <input id="instructor-note" name="note" type="text" maxlength="300" autocomplete="off" />
      </div>
      <button id="submit-button" type="submit">Submit suggestion</button>
    </form>

    <div id="status-message" role="status" aria-live="polite"></div>

    <div class="leaderboard-section">
      <h2>INSTRUCTOR LEADERBOARD</h2>
      <div id="banner"></div>
      <ul id="nominee-list"></ul>
      <p id="empty-state">No suggestions yet — be the first to nominate someone!</p>
    </div>

    <div id="admin-panel" class="admin-panel" style="display: none;">
      <h2>ADMIN</h2>
      <div class="admin-toggle-row">
        <span>Submissions</span>
        <button id="admin-toggle-submissions" type="button" class="admin-toggle-btn"></button>
      </div>
      <div class="admin-toggle-row">
        <span>Voting</span>
        <button id="admin-toggle-voting" type="button" class="admin-toggle-btn"></button>
      </div>
      <div class="admin-lock-row">
        <button id="admin-lock-btn" type="button" class="nominee-action-btn">Lock admin mode</button>
      </div>
    </div>

  </main>

  <div id="admin-corner" aria-hidden="true"></div>

  <script type="module">
    const CONFIG = {
      FIREBASE: {
        apiKey: "AIzaSyBqMJlchU_luM5-XcPo0USDUjsM60Qfoqg",
        authDomain: "our-daily.firebaseapp.com",
        projectId: "our-daily",
        storageBucket: "our-daily.firebasestorage.app",
        messagingSenderId: "337201931314",
        appId: "1:337201931314:web:fb5677846d03eb285ac82b"
      }
    };

    const form = document.getElementById('nomination-form');
    const submitButton = document.getElementById('submit-button');
    const statusEl = document.getElementById('status-message');
    const nameInput = document.getElementById('instructor-name');
    const linkInput = document.getElementById('instructor-link');
    const noteInput = document.getElementById('instructor-note');
    const bannerEl = document.getElementById('banner');
    const listEl = document.getElementById('nominee-list');
    const emptyStateEl = document.getElementById('empty-state');
    const confirmModalOverlay = document.getElementById('confirm-modal-overlay');
    const confirmModalMessage = document.getElementById('confirm-modal-message');
    const confirmModalYes = document.getElementById('confirm-modal-yes');
    const confirmModalNo = document.getElementById('confirm-modal-no');
    const adminPasscodeOverlay = document.getElementById('admin-passcode-overlay');
    const adminPasscodeInput = document.getElementById('admin-passcode-input');
    const adminPasscodeSubmit = document.getElementById('admin-passcode-submit');
    const adminPasscodeCancel = document.getElementById('admin-passcode-cancel');
    const adminPanel = document.getElementById('admin-panel');
    const adminLockBtn = document.getElementById('admin-lock-btn');
    const adminToggleSubmissions = document.getElementById('admin-toggle-submissions');
    const adminToggleVoting = document.getElementById('admin-toggle-voting');

    // Client-side passcode only — visible to anyone who reads the page source, and the
    // Firestore write rule doesn't check it either (see firestore.rules). This is a
    // reviewed, accepted tradeoff: same honor-system model as the rest of this feature,
    // not real auth. Good enough to keep casual visitors out; not brute-force-proof.
    const ADMIN_PASSCODE = 'odqodqodq';
    let isAdminUnlocked = localStorage.getItem('nookAdminUnlocked') === 'true';

    function showStatus(kind, text) {
      statusEl.className = `show ${kind}`;
      statusEl.textContent = text;
    }

    function showConfirmModal(message) {
      return new Promise((resolve) => {
        confirmModalMessage.textContent = message;
        confirmModalOverlay.classList.add('show');

        function onYes() {
          cleanup();
          resolve(true);
        }
        function onNo() {
          cleanup();
          resolve(false);
        }
        function cleanup() {
          confirmModalOverlay.classList.remove('show');
          confirmModalYes.removeEventListener('click', onYes);
          confirmModalNo.removeEventListener('click', onNo);
        }
        confirmModalYes.addEventListener('click', onYes);
        confirmModalNo.addEventListener('click', onNo);
      });
    }

    function getOrCreateClientId() {
      const key = 'nookInstructorClientId';
      let id = localStorage.getItem(key);
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem(key, id);
      }
      return id;
    }

    async function sha256Hex(text) {
      const bytes = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(hashBuffer))
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('');
    }

    function normalizeName(value) {
      return String(value || '').replace(/\s+/g, ' ').trim().slice(0, 80);
    }

    function levenshteinDistance(a, b) {
      const m = a.length;
      const n = b.length;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
        }
      }
      return dp[m][n];
    }

    // 1 = identical, 0 = nothing alike. Substrings (e.g. "Jane" within "Jane Doe") score
    // high without going through edit-distance math, since one isn't really a typo of the other.
    function nameSimilarity(a, b) {
      const normA = String(a || '').toLowerCase().trim();
      const normB = String(b || '').toLowerCase().trim();
      if (!normA || !normB) return 0;
      if (normA === normB) return 1;
      if (normA.includes(normB) || normB.includes(normA)) return 0.9;
      const maxLen = Math.max(normA.length, normB.length);
      return 1 - levenshteinDistance(normA, normB) / maxLen;
    }

    // Accepts a full URL, a bare domain, or an Instagram handle (with or without "@")
    // and resolves it to a clickable href — handles become instagram.com profile links.
    // Instagram usernames may contain dots (e.g. "zakfoster.quilts"), so a bare dot isn't
    // enough to call something a domain — require a recognized TLD, "www.", or a path "/".
    function resolveNomineeLinkHref(rawLink) {
      const value = String(rawLink || '').trim();
      if (!value) return '';
      if (/^https?:\/\//i.test(value)) return value;
      const KNOWN_TLD_PATTERN = /\.(com|net|org|io|co|us|uk|ca|shop|studio|art|blog|me|info|biz|design|store|online|site|xyz|app|dev|gallery)(\/|$)/i;
      const looksLikeDomain = value.includes('/') || /^www\./i.test(value) || KNOWN_TLD_PATTERN.test(value);
      if (looksLikeDomain) return `https://${value}`;
      const handle = value.replace(/^@/, '');
      return `https://www.instagram.com/${encodeURIComponent(handle)}/`;
    }

    Promise.all([
      import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js')
    ]).then(async ([{ initializeApp }, firestoreModule]) => {
      const { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, writeBatch } = firestoreModule;
      const app = initializeApp(CONFIG.FIREBASE);
      const db = getFirestore(app);

      const clientId = getOrCreateClientId();
      const clientDocId = (await sha256Hex(clientId)).slice(0, 40);

      // Each browser/device can heart at most this many instructors.
      const MAX_VOTES_PER_PERSON = 12;

      // Refreshed by loadLeaderboard(); used to nudge submitters toward an existing name
      // instead of silently creating a near-duplicate entry (see findSimilarNominee below).
      let knownNominees = [];
      let cachedNominees = [];

      function myVoteCount() {
        return cachedNominees.reduce((sum, n) => sum + (n.voted ? 1 : 0), 0);
      }

      function syncHeartAvailability() {
        if (!votingOpen) return;
        const atLimit = myVoteCount() >= MAX_VOTES_PER_PERSON;
        listEl.querySelectorAll('.nominee-row').forEach((row) => {
          const heart = row.querySelector('.heart-button');
          if (!heart) return;
          const voted = heart.classList.contains('voted');
          heart.disabled = atLimit && !voted;
        });
      }

      const SIMILARITY_THRESHOLD = 0.72;
      function findSimilarNominee(name) {
        let best = null;
        let bestScore = 0;
        for (const nominee of knownNominees) {
          const score = nameSimilarity(name, nominee.name);
          if (score >= SIMILARITY_THRESHOLD && score > bestScore) {
            best = nominee;
            bestScore = score;
          }
        }
        return best;
      }

      let submissionsOpen = true;
      let votingOpen = false;
      try {
        const configSnap = await getDoc(doc(db, 'instructorLeaderboardConfig', 'settings'));
        const configData = configSnap.exists() ? configSnap.data() : {};
        submissionsOpen = configData.submissionsOpen !== false;
        votingOpen = configData.votingOpen === true;
      } catch (err) {
        console.warn('Could not load leaderboard config, defaulting to submissions-open/voting-closed:', err);
      }

      function applySubmissionsOpenState() {
        if (!submissionsOpen) {
          form.style.display = 'none';
          showStatus('closed', "Suggestions are closed for now — thanks to everyone who submitted! See who's been suggested below.");
        } else {
          form.style.display = '';
          statusEl.className = '';
          statusEl.textContent = '';
        }
      }
      applySubmissionsOpenState();

      function renderNomineeRow(nominee, index) {
        const li = document.createElement('li');
        li.className = 'nominee-row';
        li.dataset.nomineeId = nominee.id;

        const rank = document.createElement('div');
        rank.className = 'nominee-rank';
        rank.textContent = votingOpen ? `${index + 1}.` : '';
        li.appendChild(rank);

        const info = document.createElement('div');
        info.className = 'nominee-info';
        const nameEl = document.createElement('div');
        nameEl.className = 'nominee-name';
        nameEl.textContent = nominee.name;
        info.appendChild(nameEl);
        if (nominee.link) {
          const linkEl = document.createElement('a');
          linkEl.className = 'nominee-link';
          linkEl.href = resolveNomineeLinkHref(nominee.link);
          linkEl.target = '_blank';
          linkEl.rel = 'noopener noreferrer';
          linkEl.textContent = nominee.link;
          info.appendChild(linkEl);
        }
        li.appendChild(info);

        const votesEl = document.createElement('div');
        votesEl.className = 'nominee-votes';
        votesEl.textContent = votingOpen ? String(nominee.votes) : '';
        li.appendChild(votesEl);

        const heartButton = document.createElement('button');
        heartButton.type = 'button';
        heartButton.className = `heart-button${nominee.voted ? ' voted' : ''}`;
        heartButton.setAttribute('aria-label', nominee.voted ? `Remove vote for ${nominee.name}` : `Vote for ${nominee.name}`);
        // Nothing is clickable/voteable until votingOpen is flipped on server-side config.
        heartButton.disabled = !votingOpen || (!nominee.voted && myVoteCount() >= MAX_VOTES_PER_PERSON);
        li.appendChild(heartButton);

        if (votingOpen) {
          heartButton.addEventListener('click', async () => {
            heartButton.disabled = true;
            try {
              const voteRef = doc(db, 'instructorNominations', nominee.id, 'votes', clientDocId);
              if (nominee.voted) {
                await deleteDoc(voteRef);
                nominee.voted = false;
                nominee.votes = Math.max(0, nominee.votes - 1);
              } else {
                if (myVoteCount() >= MAX_VOTES_PER_PERSON) {
                  alert(`You can only vote for up to ${MAX_VOTES_PER_PERSON} instructors. Remove a heart to free up a vote.`);
                  return;
                }
                await setDoc(voteRef, { createdAtIso: new Date().toISOString() });
                nominee.voted = true;
                nominee.votes += 1;
              }
              votesEl.textContent = String(nominee.votes);
              heartButton.className = `heart-button${nominee.voted ? ' voted' : ''}`;
              heartButton.setAttribute('aria-label', nominee.voted ? `Remove vote for ${nominee.name}` : `Vote for ${nominee.name}`);
              updateLeaderboardBanner(cachedNominees);
              syncHeartAvailability();
            } catch (err) {
              console.error('Vote failed:', err);
            } finally {
              syncHeartAvailability();
            }
          });
        }

        // Ownership here is device-based (same hashed local client id used for votes) —
        // there's no sign-in, so these controls only appear for the device that submitted,
        // or for any row once admin mode is passcode-unlocked in this browser.
        // Hidden once submissions close since the rules would reject the write anyway —
        // use the Firebase console (Admin SDK bypasses rules) to edit/delete after that.
        if ((nominee.isMine || isAdminUnlocked) && submissionsOpen) {
          const actions = document.createElement('div');
          actions.className = 'nominee-actions';

          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'nominee-action-btn';
          editBtn.textContent = 'Edit';
          editBtn.addEventListener('click', () => showEditRow(li, nominee));
          actions.appendChild(editBtn);

          const deleteBtn = document.createElement('button');
          deleteBtn.type = 'button';
          deleteBtn.className = 'nominee-action-btn';
          deleteBtn.textContent = 'Delete';
          deleteBtn.addEventListener('click', () => handleDelete(nominee));
          actions.appendChild(deleteBtn);

          li.appendChild(actions);
        }

        return li;
      }

      function showEditRow(li, nominee) {
        li.innerHTML = '';
        li.className = 'nominee-edit-row';

        const nameLabel = document.createElement('div');
        nameLabel.className = 'nominee-name';
        nameLabel.textContent = `Editing: ${nominee.name}`;
        li.appendChild(nameLabel);

        const linkInputEdit = document.createElement('input');
        linkInputEdit.type = 'text';
        linkInputEdit.placeholder = 'Instagram or website (optional)';
        linkInputEdit.maxLength = 200;
        linkInputEdit.value = nominee.link || '';
        li.appendChild(linkInputEdit);

        const noteInputEdit = document.createElement('input');
        noteInputEdit.type = 'text';
        noteInputEdit.placeholder = 'Why them? (optional)';
        noteInputEdit.maxLength = 300;
        noteInputEdit.value = nominee.note || '';
        li.appendChild(noteInputEdit);

        const actionsRow = document.createElement('div');
        actionsRow.className = 'nominee-edit-actions';

        const saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.textContent = 'Save';
        actionsRow.appendChild(saveBtn);

        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'cancel-btn';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', () => {
          replaceNomineeRow(nominee);
        });
        actionsRow.appendChild(cancelBtn);

        li.appendChild(actionsRow);

        saveBtn.addEventListener('click', async () => {
          saveBtn.disabled = true;
          try {
            const newLink = String(linkInputEdit.value || '').trim().slice(0, 200);
            const newNote = String(noteInputEdit.value || '').trim().slice(0, 300);
            const nowIso = new Date().toISOString();
            const nominationRef = doc(db, 'instructorNominations', nominee.id);
            const snap = await getDoc(nominationRef);
            const current = snap.exists() ? snap.data() : {};
            await updateDoc(nominationRef, {
              submissionCount: (Number(current.submissionCount) || 1) + 1,
              lastSubmittedAtIso: nowIso,
              link: newLink,
              note: newNote
            });
            await setDoc(doc(db, 'instructorNominations', nominee.id, 'submitters', clientDocId), {
              link: newLink,
              note: newNote,
              submittedAtIso: nowIso
            }, { merge: true });
            nominee.link = newLink;
            nominee.note = newNote;
            replaceNomineeRow(nominee);
          } catch (err) {
            console.error('Edit failed:', err);
            alert('Could not save your changes right now — please try again.');
            saveBtn.disabled = false;
          }
        });
      }

      async function deleteNominationFully(nominationId) {
        const [votesSnap, submittersSnap] = await Promise.all([
          getDocs(collection(db, 'instructorNominations', nominationId, 'votes')),
          getDocs(collection(db, 'instructorNominations', nominationId, 'submitters'))
        ]);
        const batch = writeBatch(db);
        for (const voteDoc of votesSnap.docs) batch.delete(voteDoc.ref);
        for (const submitterDoc of submittersSnap.docs) batch.delete(submitterDoc.ref);
        batch.delete(doc(db, 'instructorNominations', nominationId));
        await batch.commit();
      }

      async function handleDelete(nominee) {
        const adminRemovingEntry = isAdminUnlocked;
        const message = adminRemovingEntry
          ? `Remove "${nominee.name}" from the list entirely?`
          : `Remove your suggestion of "${nominee.name}"?`;
        if (!confirm(message)) return;
        try {
          if (adminRemovingEntry) {
            await deleteNominationFully(nominee.id);
            removeNomineeFromList(nominee.id);
            return;
          }

          await deleteDoc(doc(db, 'instructorNominations', nominee.id, 'submitters', clientDocId));

          // If no other device still has a submitter record for this instructor and nobody
          // has voted for it yet, the shared nomination doc can go too. Otherwise leave it —
          // it may still represent other people's interest or an active vote.
          const [votesSnap, submittersSnap] = await Promise.all([
            getDocs(collection(db, 'instructorNominations', nominee.id, 'votes')),
            getDocs(collection(db, 'instructorNominations', nominee.id, 'submitters'))
          ]);
          if (votesSnap.size === 0 && submittersSnap.size === 0) {
            await deleteDoc(doc(db, 'instructorNominations', nominee.id));
            removeNomineeFromList(nominee.id);
          } else {
            nominee.isMine = false;
            replaceNomineeRow(nominee);
          }
        } catch (err) {
          console.error('Delete failed:', err);
          alert('Could not remove your suggestion right now — please try again.');
        }
      }

      async function buildNomineeFromDoc(nominationDoc) {
        const data = nominationDoc.data() || {};
        if (!data.name) return null;
        const nominee = {
          id: nominationDoc.id,
          name: data.name,
          link: data.link || '',
          note: data.note || '',
          votes: 0,
          voted: false,
          isMine: false
        };
        const [votesSnap, submitterSnap] = await Promise.all([
          votingOpen
            ? getDocs(collection(db, 'instructorNominations', nominationDoc.id, 'votes'))
            : Promise.resolve(null),
          getDoc(doc(db, 'instructorNominations', nominationDoc.id, 'submitters', clientDocId))
        ]);
        if (votesSnap) {
          nominee.votes = votesSnap.size;
          nominee.voted = votesSnap.docs.some((d) => d.id === clientDocId);
        }
        nominee.isMine = submitterSnap.exists();
        return nominee;
      }

      async function fetchNominees() {
        const nominationsSnap = await getDocs(collection(db, 'instructorNominations'));
        const nominees = await Promise.all(nominationsSnap.docs.map((docSnap) => buildNomineeFromDoc(docSnap)));
        return nominees.filter(Boolean);
      }

      function sortNominees(nominees) {
        if (votingOpen) {
          nominees.sort((a, b) => b.votes - a.votes || a.name.localeCompare(b.name));
        } else {
          nominees.sort((a, b) => a.name.localeCompare(b.name));
        }
      }

      function updateLeaderboardBanner(nominees) {
        if (votingOpen) {
          const used = (nominees || cachedNominees).reduce((sum, n) => sum + (n.voted ? 1 : 0), 0);
          const left = Math.max(0, MAX_VOTES_PER_PERSON - used);
          bannerEl.className = 'open';
          bannerEl.textContent = left === 0
            ? `You've used all ${MAX_VOTES_PER_PERSON} votes — tap a filled heart to free one up.`
            : `Voting is open — you have ${left} of ${MAX_VOTES_PER_PERSON} votes left. Tap a heart to support your favorites.`;
        } else {
          bannerEl.className = '';
          bannerEl.textContent = "Voting isn't open yet. Check back soon!";
        }
      }

      function renderLeaderboardList(nominees) {
        cachedNominees = nominees;
        knownNominees = nominees.map((n) => ({ id: n.id, name: n.name }));
        sortNominees(nominees);
        updateLeaderboardBanner(nominees);
        emptyStateEl.style.display = nominees.length ? 'none' : 'block';
        listEl.replaceChildren(...nominees.map((nominee, index) => renderNomineeRow(nominee, index)));
        syncHeartAvailability();
      }

      function replaceNomineeRow(nominee) {
        const index = cachedNominees.findIndex((n) => n.id === nominee.id);
        if (index === -1) return;
        cachedNominees[index] = nominee;
        const li = listEl.querySelector(`[data-nominee-id="${nominee.id}"]`);
        if (li) li.replaceWith(renderNomineeRow(nominee, index));
      }

      function removeNomineeFromList(nomineeId) {
        cachedNominees = cachedNominees.filter((n) => n.id !== nomineeId);
        knownNominees = cachedNominees.map((n) => ({ id: n.id, name: n.name }));
        listEl.querySelector(`[data-nominee-id="${nomineeId}"]`)?.remove();
        emptyStateEl.style.display = cachedNominees.length ? 'none' : 'block';
      }

      async function refreshNomineeById(nominationId) {
        const snap = await getDoc(doc(db, 'instructorNominations', nominationId));
        if (!snap.exists()) return;
        const nominee = await buildNomineeFromDoc(snap);
        if (!nominee) return;
        const existingIndex = cachedNominees.findIndex((n) => n.id === nominationId);
        if (existingIndex === -1) {
          cachedNominees.push(nominee);
        } else {
          cachedNominees[existingIndex] = nominee;
        }
        renderLeaderboardList([...cachedNominees]);
      }

      async function loadLeaderboard() {
        const nominees = await fetchNominees();
        renderLeaderboardList(nominees);
      }

      function updateAdminToggleButton(button, isOpen) {
        button.textContent = isOpen ? 'Open' : 'Closed';
        button.className = `admin-toggle-btn ${isOpen ? 'state-open' : 'state-closed'}`;
      }

      function refreshAdminPanel() {
        if (!isAdminUnlocked) {
          adminPanel.style.display = 'none';
          return;
        }
        adminPanel.style.display = 'block';
        updateAdminToggleButton(adminToggleSubmissions, submissionsOpen);
        updateAdminToggleButton(adminToggleVoting, votingOpen);
      }
      refreshAdminPanel();

      async function writeLeaderboardConfig(nextSubmissionsOpen, nextVotingOpen) {
        await setDoc(doc(db, 'instructorLeaderboardConfig', 'settings'), {
          submissionsOpen: nextSubmissionsOpen,
          votingOpen: nextVotingOpen,
          updatedAtIso: new Date().toISOString()
        });
      }

      function openAdminPasscodePrompt() {
        adminPasscodeInput.value = '';
        adminPasscodeOverlay.classList.add('show');
        adminPasscodeInput.focus();
      }

      // Same hidden trigger as the main quilt app's admin corner: long-press (or 5 quick
      // taps) inside an invisible top-right zone. No visible "Admin" affordance on the page.
      (function setupAdminCornerTrigger() {
        const adminCorner = document.getElementById('admin-corner');
        const cornerW = 120;
        const cornerH = 120;
        const holdMs = 1800;
        const moveCancelPx = 48;
        let pressTimer = null;
        let holdStart = null;
        let activeTouchId = null;
        let tapCount = 0;
        let tapResetTimer = 0;

        function isCornerPoint(x, y) {
          return x >= window.innerWidth - cornerW && y >= 0 && y <= cornerH;
        }
        function clearPressTimer() {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
          holdStart = null;
          activeTouchId = null;
        }
        function noteTap() {
          tapCount += 1;
          clearTimeout(tapResetTimer);
          tapResetTimer = setTimeout(() => {
            tapCount = 0;
          }, 1200);
          if (tapCount >= 5) {
            tapCount = 0;
            openAdminPasscodePrompt();
          }
        }
        function beginHold(x, y, touchId = null) {
          clearPressTimer();
          activeTouchId = touchId;
          holdStart = { x, y };
          pressTimer = setTimeout(() => {
            pressTimer = null;
            openAdminPasscodePrompt();
          }, holdMs);
        }

        adminCorner.addEventListener('mousedown', (e) => {
          beginHold(e.clientX, e.clientY);
        });
        document.addEventListener('mouseup', () => {
          if (activeTouchId != null) return;
          if (pressTimer) {
            clearPressTimer();
            noteTap();
          }
        });
        document.addEventListener('mousemove', (e) => {
          if (activeTouchId != null || !pressTimer || !holdStart) return;
          if (Math.hypot(e.clientX - holdStart.x, e.clientY - holdStart.y) > moveCancelPx) clearPressTimer();
        });

        adminCorner.addEventListener('touchstart', (e) => {
          const t = e.changedTouches[0];
          if (!t || !isCornerPoint(t.clientX, t.clientY)) return;
          beginHold(t.clientX, t.clientY, t.identifier);
        }, { passive: true });
        document.addEventListener('touchmove', (e) => {
          if (!pressTimer || !holdStart || activeTouchId == null) return;
          for (const t of e.touches) {
            if (t.identifier !== activeTouchId) continue;
            if (Math.hypot(t.clientX - holdStart.x, t.clientY - holdStart.y) > moveCancelPx) clearPressTimer();
            return;
          }
        }, { passive: true });
        document.addEventListener('touchend', (e) => {
          for (const t of e.changedTouches) {
            if (t.identifier !== activeTouchId) continue;
            if (pressTimer) {
              clearPressTimer();
              noteTap();
            }
            return;
          }
        }, { passive: true });
        document.addEventListener('touchcancel', (e) => {
          for (const t of e.changedTouches) {
            if (t.identifier === activeTouchId) clearPressTimer();
          }
        }, { passive: true });
      })();

      adminPasscodeCancel.addEventListener('click', () => {
        adminPasscodeOverlay.classList.remove('show');
      });

      adminPasscodeSubmit.addEventListener('click', () => {
        if (adminPasscodeInput.value === ADMIN_PASSCODE) {
          isAdminUnlocked = true;
          localStorage.setItem('nookAdminUnlocked', 'true');
          adminPasscodeOverlay.classList.remove('show');
          refreshAdminPanel();
          loadLeaderboard().catch((err) => console.error('Failed to refresh leaderboard:', err));
        } else {
          alert('Incorrect passcode.');
        }
      });

      adminPasscodeInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') adminPasscodeSubmit.click();
      });

      adminLockBtn.addEventListener('click', () => {
        isAdminUnlocked = false;
        localStorage.removeItem('nookAdminUnlocked');
        refreshAdminPanel();
        loadLeaderboard().catch((err) => console.error('Failed to refresh leaderboard:', err));
      });

      adminToggleSubmissions.addEventListener('click', async () => {
        const next = !submissionsOpen;
        adminToggleSubmissions.disabled = true;
        try {
          await writeLeaderboardConfig(next, votingOpen);
          submissionsOpen = next;
          applySubmissionsOpenState();
          refreshAdminPanel();
          loadLeaderboard().catch((err) => console.error('Failed to refresh leaderboard:', err));
        } catch (err) {
          console.error('Failed to update submissions flag:', err);
          alert('Could not update — please try again.');
        } finally {
          adminToggleSubmissions.disabled = false;
        }
      });

      adminToggleVoting.addEventListener('click', async () => {
        const next = !votingOpen;
        adminToggleVoting.disabled = true;
        try {
          await writeLeaderboardConfig(submissionsOpen, next);
          votingOpen = next;
          refreshAdminPanel();
          loadLeaderboard().catch((err) => console.error('Failed to refresh leaderboard:', err));
        } catch (err) {
          console.error('Failed to update voting flag:', err);
          alert('Could not update — please try again.');
        } finally {
          adminToggleVoting.disabled = false;
        }
      });

      loadLeaderboard().catch((err) => {
        console.error('Failed to load leaderboard:', err);
        bannerEl.textContent = 'Could not load suggestions right now — please try again in a moment.';
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        // Belt-and-suspenders: the form is hidden when closed, but admin mode can flip
        // submissionsOpen live, so re-check rather than trusting the form's visibility.
        if (!submissionsOpen) {
          showStatus('closed', 'Suggestions are closed right now.');
          return;
        }
        const name = normalizeName(nameInput.value);
        const link = String(linkInput.value || '').trim().slice(0, 200);
        const note = String(noteInput.value || '').trim().slice(0, 300);

        if (!name) {
          showStatus('error', 'Please enter an instructor name.');
          return;
        }

        submitButton.disabled = true;
        try {
          const nameKey = name.toLowerCase();
          const ownNominationId = (await sha256Hex(nameKey)).slice(0, 32);
          let nominationId = ownNominationId;
          let nominationRef = doc(db, 'instructorNominations', nominationId);
          const nowIso = new Date().toISOString();
          let existingSnap = await getDoc(nominationRef);

          // No exact-name match — check for a similar existing entry (typo, nickname,
          // "Jane" vs "Jane Doe") and ask before quietly creating a near-duplicate row.
          if (!existingSnap.exists()) {
            const similar = findSimilarNominee(name);
            if (similar) {
              const sameEntry = await showConfirmModal(
                `We have "${similar.name}" on the list already. Is that who you meant?`
              );
              if (sameEntry) {
                const matchedSnap = await getDoc(doc(db, 'instructorNominations', similar.id));
                if (matchedSnap.exists()) {
                  nominationId = similar.id;
                  nominationRef = doc(db, 'instructorNominations', nominationId);
                  existingSnap = matchedSnap;
                }
                // else: it was removed since the page loaded — fall through and
                // add "name" as its own fresh entry under ownNominationId instead.
              }
            }
          }

          if (existingSnap.exists()) {
            const existing = existingSnap.data() || {};
            await updateDoc(nominationRef, {
              submissionCount: (Number(existing.submissionCount) || 1) + 1,
              lastSubmittedAtIso: nowIso,
              link: link || existing.link || '',
              note: note || existing.note || ''
            });
            showStatus('duplicate', `You've already suggested ${existing.name || name} — thanks for the enthusiasm! We've noted your interest again.`);
          } else {
            await setDoc(nominationRef, {
              name,
              nameKey,
              link,
              note,
              submissionCount: 1,
              firstSubmittedAtIso: nowIso,
              lastSubmittedAtIso: nowIso
            });
            showStatus('success', `Thanks! ${name} has been added to the suggestion list.`);
          }

          // Records this device as a submitter so the leaderboard can show Edit/Delete
          // controls for it (see loadLeaderboard's isMine check).
          await setDoc(doc(db, 'instructorNominations', nominationId, 'submitters', clientDocId), {
            link,
            note,
            submittedAtIso: nowIso
          }, { merge: true });

          form.reset();
          refreshNomineeById(nominationId).catch((err) => console.error('Failed to refresh nominee row:', err));
        } catch (err) {
          console.error('Instructor nomination failed:', err);
          if (err && err.code === 'permission-denied') {
            showStatus('closed', 'Suggestions just closed — thanks for your interest!');
          } else {
            showStatus('error', 'Something went wrong — please try again in a moment.');
          }
        } finally {
          submitButton.disabled = false;
        }
      });
    }).catch((err) => {
      console.error('Failed to load Firebase:', err);
      showStatus('error', 'Could not connect right now — please try again in a moment.');
    });
  </script>
</body>
</html>
