name: Speaker Cutouts

on:
  workflow_dispatch:
    inputs:
      author:
        description: "Optional author filter, e.g. kusama"
        required: false
        default: ""
      doc:
        description: "Optional Firestore quote doc id"
        required: false
        default: ""
      limit:
        description: "Max speakers to process"
        required: false
        default: "1"
      force:
        description: "Regenerate existing cutouts"
        required: false
        type: boolean
        default: false
      recrop_existing:
        description: "Crop the existing transparent cutout locally without re-running background removal"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Preview matches without running background removal"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies (skip native builds)
        timeout-minutes: 8
        run: npm ci --ignore-scripts

      - name: Setup Python (for rembg)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache rembg models
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-models-${{ runner.os }}-v1

      - name: Install rembg
        timeout-minutes: 8
        run: |
          set -euo pipefail
          pip install "rembg[cpu,cli]"
          for model in isnet-general-use u2net; do rembg d "$model"; done

      - name: Validate required secrets
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            echo "Missing required secret: GOOGLE_APPLICATION_CREDENTIALS_JSON"
            exit 1
          fi

      - name: Process speaker cutouts
        timeout-minutes: 12
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIRESTORE_QUOTES_COLLECTION: ${{ secrets.FIRESTORE_QUOTES_COLLECTION }}
          AUTHOR: ${{ inputs.author }}
          DOC_ID: ${{ inputs.doc }}
          LIMIT: ${{ inputs.limit }}
          FORCE: ${{ inputs.force }}
          RECROP_EXISTING: ${{ inputs.recrop_existing }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          cmd=(node scripts/process-speaker-cutouts.cjs)
          if [ "${DRY_RUN}" = "true" ]; then cmd+=(--dry-run); fi
          if [ "${FORCE}" = "true" ]; then cmd+=(--force); fi
          if [ "${RECROP_EXISTING}" = "true" ]; then cmd+=(--recrop-existing); fi
          if [ -n "${AUTHOR:-}" ]; then cmd+=("--author=${AUTHOR}"); fi
          if [ -n "${DOC_ID:-}" ]; then cmd+=("--doc=${DOC_ID}"); fi
          if [ -z "${AUTHOR:-}" ] && [ -z "${DOC_ID:-}" ]; then cmd+=(--today-speaker); fi
          if [ -n "${LIMIT:-}" ]; then cmd+=("--limit=${LIMIT}"); fi
          "${cmd[@]}"
