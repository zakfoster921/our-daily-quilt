# Manual-trigger only: pre-render newspaper clipping PNG for a specific date (testing / backfill).
# Nightly clipping generation is handled by the nightly-instagram-snapshot workflow.

name: Today newspaper clipping PNG

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      date_key_mode:
        description: "Quick date — pick Today for current app day, or Custom to type date_key below."
        required: true
        type: choice
        default: active
        options:
          - active
          - today
          - custom
      date_key:
        description: "Custom YYYY-MM-DD (when mode = custom). You can also type today here."
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  today-newspaper-clipping:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        timeout-minutes: 8
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-chromium-headless-shell

      - name: Install Playwright Chromium headless shell
        timeout-minutes: 8
        run: npx playwright install chromium-headless-shell

      - name: Resolve target date key
        id: resolve_date
        env:
          WORKFLOW_DATE_MODE: ${{ inputs.date_key_mode || 'active' }}
          WORKFLOW_DATE_KEY: ${{ inputs.date_key || '' }}
        run: |
          set -euo pipefail
          EFFECTIVE_DATE_KEY="$(node scripts/lib/resolve-workflow-date-key.cjs)"
          case "${WORKFLOW_DATE_MODE}" in
            today) echo "Using today's app date: ${EFFECTIVE_DATE_KEY}" ;;
            custom) echo "Using custom date_key: ${EFFECTIVE_DATE_KEY}" ;;
            *) echo "Using active quilt day: ${EFFECTIVE_DATE_KEY}" ;;
          esac
          if ! echo "${EFFECTIVE_DATE_KEY}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Invalid resolved date key: ${EFFECTIVE_DATE_KEY}"
            exit 1
          fi
          TOMORROW_DATE_KEY="$(node -e "
            const { addDays } = require('./scripts/lib/app-date-key.cjs');
            process.stdout.write(addDays('${EFFECTIVE_DATE_KEY}', 1));
          ")"
          echo "date_key=${EFFECTIVE_DATE_KEY}" >> "$GITHUB_OUTPUT"
          echo "tomorrow_date_key=${TOMORROW_DATE_KEY}" >> "$GITHUB_OUTPUT"
          if [ "${WORKFLOW_DATE_MODE}" = "custom" ] || [ -n "${WORKFLOW_DATE_KEY:-}" ]; then
            echo "skip_tomorrow_lookahead=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_tomorrow_lookahead=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Tomorrow lookahead date: ${TOMORROW_DATE_KEY} (skip=$([ "${WORKFLOW_DATE_MODE}" = "custom" ] || [ -n "${WORKFLOW_DATE_KEY:-}" ] && echo yes || echo no))"

      - name: Start local app (same commit as workflow)
        run: |
          set -euo pipefail
          mkdir -p tmp
          npx --yes serve@14 -l 8765 . > tmp/serve-today-clipping.log 2>&1 &
          echo "SERVE_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8765/our-daily-beta.html" >/dev/null; then
              echo "Local app ready on :8765"
              exit 0
            fi
            sleep 1
          done
          cat tmp/serve-today-clipping.log || true
          echo "::error::Local static server failed to start"
          exit 1

      - name: Generate newspaper clipping for today
        timeout-minutes: 15
        env:
          RESET_URL: ${{ secrets.RESET_URL }}
          DATE_KEY: ${{ steps.resolve_date.outputs.date_key }}
          NIGHTLY_IG_CLIPPING_ONLY: "true"
          NIGHTLY_IG_SKIP_SCHEDULE_GUARD: "true"
          NIGHTLY_IG_MAX_ATTEMPTS: "3"
          NIGHTLY_IG_ARTIFACTS_DIR: "tmp/nightly-ig-artifacts"
        run: |
          set -euo pipefail
          if [ -z "${RESET_URL:-}" ]; then
            echo "Missing RESET_URL secret"
            exit 1
          fi
          API_BASE_URL="${RESET_URL%/api/daily-reset}"
          APP_URL="http://127.0.0.1:8765/our-daily-beta.html"
          echo "API_BASE_URL=${API_BASE_URL} (Firestore/API)"
          echo "APP_URL=${APP_URL} (clipping JS from this commit)"
          APP_URL="$APP_URL" API_BASE_URL="$API_BASE_URL" DATE_KEY="${DATE_KEY:-}" \
            NIGHTLY_IG_CLIPPING_ONLY=true \
            NIGHTLY_IG_SKIP_SCHEDULE_GUARD=true \
            NIGHTLY_IG_MAX_ATTEMPTS="${NIGHTLY_IG_MAX_ATTEMPTS}" \
            NIGHTLY_IG_ARTIFACTS_DIR="${NIGHTLY_IG_ARTIFACTS_DIR}" \
            npm run nightly:newspaper-clipping

      - name: Generate newspaper clipping for tomorrow (admin preview lookahead)
        if: steps.resolve_date.outputs.skip_tomorrow_lookahead != 'true'
        timeout-minutes: 15
        env:
          RESET_URL: ${{ secrets.RESET_URL }}
          DATE_KEY: ${{ steps.resolve_date.outputs.tomorrow_date_key }}
          NIGHTLY_IG_CLIPPING_ONLY: "true"
          NIGHTLY_IG_SKIP_SCHEDULE_GUARD: "true"
          NIGHTLY_IG_MAX_ATTEMPTS: "3"
          NIGHTLY_IG_ARTIFACTS_DIR: "tmp/nightly-ig-artifacts-tomorrow"
        run: |
          set -euo pipefail
          if [ -z "${RESET_URL:-}" ]; then
            echo "Missing RESET_URL secret"
            exit 1
          fi
          API_BASE_URL="${RESET_URL%/api/daily-reset}"
          APP_URL="http://127.0.0.1:8765/our-daily-beta.html"
          echo "Tomorrow lookahead DATE_KEY=${DATE_KEY}"
          echo "API_BASE_URL=${API_BASE_URL} (Firestore/API)"
          echo "APP_URL=${APP_URL} (clipping JS from this commit)"
          APP_URL="$APP_URL" API_BASE_URL="$API_BASE_URL" DATE_KEY="${DATE_KEY:-}" \
            NIGHTLY_IG_CLIPPING_ONLY=true \
            NIGHTLY_IG_SKIP_SCHEDULE_GUARD=true \
            NIGHTLY_IG_MAX_ATTEMPTS="${NIGHTLY_IG_MAX_ATTEMPTS}" \
            NIGHTLY_IG_ARTIFACTS_DIR="${NIGHTLY_IG_ARTIFACTS_DIR}" \
            npm run nightly:newspaper-clipping

      - name: Stop local app server
        if: always()
        run: |
          if [ -n "${SERVE_PID:-}" ]; then
            kill "${SERVE_PID}" 2>/dev/null || true
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: today-newspaper-clipping-failure
          path: |
            tmp/nightly-ig-artifacts
            tmp/nightly-ig-artifacts-tomorrow
          if-no-files-found: ignore
