# One-off: reset today's saved Layout B tuner settings (slide 1) to the coded defaults.
# Only touches tune fields on instagram-images/{date}. Run with dry_run=true first to just list them.
name: Reset slide 1 tuner to defaults

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      date_key:
        description: "Optional YYYY-MM-DD. Leave empty for the current app day."
        required: false
      dry_run:
        description: "true = only list the fields that would be cleared"
        required: false
        default: "false"

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Reset tune fields
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          DATE_KEY: ${{ inputs.date_key || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/reset-layout-b-tune.cjs
