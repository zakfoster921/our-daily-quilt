<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Emoji ink example</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #c5d5c0;
      font-family: Georgia, "Times New Roman", serif;
      color: #3a342c;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }
    p.note {
      margin: 0 0 18px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }
    .card {
      background: #f4efe6;
      padding: 28px 32px 26px;
      margin: 0 0 22px;
      box-shadow: 0 8px 24px rgba(40, 50, 30, 0.12);
    }
    .label {
      font-family: system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0 0 14px;
      color: #6d6458;
    }
    .title {
      margin: 0;
      text-align: center;
      font-family: "Arial Narrow", "Helvetica Neue", sans-serif;
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.08em;
      font-size: 28px;
      color: #5c5448;
    }
    .rule {
      width: 28%;
      height: 1px;
      margin: 12px auto;
      background: rgba(35, 28, 22, 0.55);
    }
    .names {
      margin: 0;
      text-align: center;
      font-family: "DM Sans", system-ui, -apple-system, sans-serif;
      font-size: 22px;
      line-height: 1.45;
      color: rgba(56, 46, 36, 0.86);
    }
    .cloud {
      margin: 8px 0 0;
      text-align: center;
      font-weight: 600;
      font-size: 30px;
      color: #43677b;
    }
    .cloud .name { display: inline-block; margin: 0 0.35em; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #f4efe6;
    }
    .ink-emoji {
      display: inline-block;
      position: relative;
      background-color: currentColor;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      color: inherit;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
      line-height: 1;
    }
    .ink-emoji__glyph {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Emoji color example</h1>
    <p class="note">Same names. Top is the old full-color emoji. Bottom is the new ink, matching the text.</p>

    <section class="card">
      <p class="label">Before</p>
      <h2 class="title">MANY HANDS MADE THIS QUILT !</h2>
      <div class="rule"></div>
      <p class="names">Thanks to: Bj · Groover🦋 · Rubio🌙 · Em💕 · Kate</p>
      <div class="rule"></div>
      <p class="cloud"><span class="name">Groover🦋</span><span class="name">Rubio🌙</span><span class="name">Em💕</span><span class="name">Kate</span></p>
    </section>

    <section class="card">
      <p class="label">After — quilt screen</p>
      <h2 class="title">MANY HANDS MADE THIS QUILT !</h2>
      <div class="rule"></div>
      <p class="names" id="names"></p>
      <div class="rule"></div>
      <p class="cloud" id="cloud"></p>
    </section>

    <section class="card">
      <p class="label">After — Instagram card</p>
      <canvas id="ig" width="1100" height="280"></canvas>
    </section>
  </main>
  <script src="/lib/ink-emoji.js?v=1"></script>
  <script>
    const line = 'Thanks to: Bj · Groover🦋 · Rubio🌙 · Em💕 · Kate';
    InkEmoji.setElementText(document.getElementById('names'), line);
    const cloud = document.getElementById('cloud');
    ['Groover🦋', 'Rubio🌙', 'Em💕', 'Kate'].forEach((name) => {
      const span = document.createElement('span');
      span.className = 'name';
      InkEmoji.setElementText(span, name);
      cloud.appendChild(span);
    });

    const canvas = document.getElementById('ig');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f4efe6';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#5c5448';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = 'italic 500 42px "Arial Narrow", "Helvetica Neue", sans-serif';
    ctx.fillText('MANY HANDS MADE THIS QUILT !', 550, 78);
    ctx.strokeStyle = 'rgba(35, 28, 22, 0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(390, 102);
    ctx.lineTo(710, 102);
    ctx.moveTo(390, 210);
    ctx.lineTo(710, 210);
    ctx.stroke();
    ctx.fillStyle = 'rgba(56, 46, 36, 0.86)';
    ctx.font = '400 36px "DM Sans", system-ui, sans-serif';
    ctx.textAlign = 'center';
    InkEmoji.fillText(ctx, line, 550, 168);
  </script>
</body>
</html>
